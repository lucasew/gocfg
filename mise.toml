[tools]
"github:lucasew/workspaced" = "0.1.5"
go = "1.21.0"

[tasks.install]
depends = ["install:*"]

[tasks."install:go"]
run = "go mod download"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:echo"]
run = "echo 'No codegen configured'"

[tasks.test]
depends = ["test:*"]

[tasks."test:go"]
run = "go test -v ./..."

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.ci]
depends = ["lint", "test"]
